name: Verify brew nspawn image

# The brew image is a deliberate non-distroless machine-image lane. It is
# expensive (a full FSDK dev-environment rootfs) and unrelated to OCI image
# publication, so it does not run on every pull request -- only on a weekly
# schedule, on demand, and on pull requests that actually touch brew (gated by
# the `paths:` filter below) so element changes are built in CI. See issue #390.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
  # Exercise the brew element on pull requests (issue #390). Gated by `paths:`
  # so an unrelated PR -- one that never touches brew -- stays cheap and skips
  # the heavy build entirely; a change to a brew element or its recipe runs it.
  pull_request:
    paths:
      - elements/brew/**
      - elements/oci/brew-nspawn.bst
      - Justfile

concurrency:
  group: brew-nspawn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-brew:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: just

      - name: Verify brew nspawn machine image
        run: just verify-brew

      - name: Summarize exported artifacts
        if: always()
        run: |
          if [ -d dist ]; then
            {
              echo '## brew nspawn artifacts'
              echo
              echo '```text'
              ls -lh dist
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
